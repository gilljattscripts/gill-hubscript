name: Build GILL Soundboard Windows EXE
on:
  push:
    paths:
      - 'soundboard/windows/**'
      - '.github/workflows/build-gill-soundboard-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy sounddevice pyinstaller pillow edge-tts miniaudio
      - name: Generate GILL app icon
        run: python soundboard/tools/make_brand_assets.py
      - name: Check Python syntax and live voice processing
        run: |
          python -m py_compile soundboard/windows/gill_soundboard.py soundboard/windows/voice_fx.py soundboard/windows/tts_engine.py soundboard/windows/meme_browser.py soundboard/windows/meme_packs.py
          python soundboard/windows/test_voice_fx.py
          python soundboard/windows/test_meme_browser.py
          python soundboard/windows/test_meme_packs.py
          python soundboard/windows/test_mixer_playback.py
      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GILL-Soundboard --icon soundboard/windows/gill_icon.ico --add-data "soundboard/windows/gill_icon.ico;." --add-data "soundboard/windows/assets/gill_logo_small.png;assets" --add-data "soundboard/windows/assets/gill_soundpack.txt;assets" --collect-all _sounddevice_data --collect-all edge_tts --collect-all miniaudio soundboard/windows/gill_soundboard.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: GILL-Soundboard-Windows
          path: dist/GILL-Soundboard.exe
          if-no-files-found: error
          retention-days: 30
