name: Build GILL Soundboard APK
on:
  push:
    paths:
      - 'soundboard/**'
      - '.github/workflows/build-gill-soundboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Create original launcher logo and artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 soundboard/tools/make_brand_assets.py
      - name: Compile APK with no synthesized audio
        working-directory: soundboard
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify no generated meme sounds are bundled
        run: |
          if unzip -Z1 soundboard/app/build/outputs/apk/debug/app-debug.apk | grep -E 'res/raw/gill_(sfx|chaos)'; then
            echo 'Unexpected synthesized audio found'; exit 1
          fi
      - name: Verify APK target and signature
        run: |
          APK="soundboard/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'35'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gill-soundboard-debug
          path: soundboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
