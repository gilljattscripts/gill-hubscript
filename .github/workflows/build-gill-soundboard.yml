name: Build GILL Soundboard APK
on:
  push:
    paths:
      - 'soundboard/**'
      - '.github/workflows/build-gill-soundboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile the Android app
        working-directory: soundboard
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gill-soundboard-debug
          path: soundboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
