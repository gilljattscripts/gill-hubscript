plugins {
    id 'com.android.application'
}
android {
    namespace 'com.gill.soundboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gill.soundboard'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
